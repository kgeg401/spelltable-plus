<!doctype html><html lang="en"><head><meta charset="utf-8"><title>SpellTable Plus</title><link rel="stylesheet" href="/style.css"></head><body>
<header><strong>SpellTable Plus</strong><span id="room-label">Private table</span><button id="copy">Copy code</button><button id="leave">Leave</button></header>
<section id="lobby"><div><h1>Take a seat.</h1><p>Find a Commander table that fits.</p><label>Your name<input id="name" maxlength="32" value="Player"></label><label>Matchmaking server<input id="server-address" placeholder="Local server (default)"></label><label>Table title<input id="room-title" maxlength="120" placeholder="BR3 no mox · relaxed game"></label><label class="inline"><input type="checkbox" id="public-room"> List my table publicly</label><label>Room code<input id="code" maxlength="8" placeholder="ABC12345"></label><button id="create">Create table</button><button id="join">Join table</button></div><div class="lobby-browser"><h2>Find a table</h2><label>Match keywords<input id="include" placeholder="BR3 no mox, BR4"></label><label>Exclude keywords<input id="exclude" placeholder="cedh, tournament"></label><div class="actions"><button id="browse">Refresh tables</button><button id="queue">Auto-match</button><button id="cancel-queue" disabled>Cancel</button></div><p id="queue-status">Choose keywords to join a matching open table.</p><div id="room-list"></div></div></section>
<main hidden id="table"><div id="seats"></div><aside><section><h2>Loadout</h2><label>Deck name<input id="deck" placeholder="Krenko Tokens"></label><label>Commander<input id="commander" placeholder="Krenko, Mob Boss"></label><label>Moxfield URL<input id="link" placeholder="https://moxfield.com/decks/…"></label><div class="actions"><button id="save">Save</button><button id="share">Share deck</button></div></section><section class="references"><h2>Card reference</h2><input id="search" placeholder="Search cards from your edits"><div id="results"></div></section><section class="chat"><h2>Room chat</h2><div id="messages"></div><form id="chat"><input id="message" placeholder="Type a message…" maxlength="1000"><button>Send</button></form></section></aside></main>
<footer><label>Camera source<select id="source"><option value="recording">Recorded playmat (local test)</option><option value="camera">Camera and microphone</option></select></label><button id="start">Start camera</button><button id="mute">Mute</button><button id="lock" hidden>Lock table</button><span id="status">Ready</span></footer><script type="module" src="/app.js"></script></body></html>
