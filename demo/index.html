<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SpellTable Plus — local test lobby</title>
<style>body{background:#101719;color:#e9edf2;font:16px 'Segoe UI',sans-serif;margin:0;padding:24px}button,input{font:inherit}button{cursor:pointer;padding:10px 18px}#native{max-width:1280px;margin:30px auto}#fixture-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.bg-surface-low{padding:20px;border:1px solid #46565d;border-radius:8px}.text-xl{font-size:20px}.fixture-row{display:flex;justify-content:space-between;align-items:center;margin-top:16px}.fixture-panel{padding:20px;border:1px solid #617177;max-width:600px;margin:20px auto}#popover-container [role=button]{padding:12px;cursor:pointer;border:1px solid #617177}input{padding:10px;max-width:90%}#demo-status{color:#bedc9b}</style></head><body>
<section id="native"><h2>Local test lobby</h2><p>This is a simulation for testing the userscript. No real games, messages, camera, or microphone.</p><div id="fixture-cards"></div><p id="demo-status" role="status"></p><button id="reset">Reset demo lobby</button><button id="full">Make first table full</button></section>
<div id="popover-container"></div><div id="modal-container"></div>
<script>
// Mirrors the relevant observed public DOM; this is not a copy of SpellTable's application.
const fixtureGames=[['BR4 casual commander',3],['BR3 no mox relaxed',2],['BR4 late night',1],['BR3 no mox chill games',3],['cEDH full table',4]];
const native=document.querySelector('#fixture-cards'),status=document.querySelector('#demo-status');
function lobby(){history.replaceState({},'', '/lobby');document.querySelector('#popover-container').replaceChildren();native.replaceChildren();for(const [title,count] of fixtureGames){const card=document.createElement('div');card.className='block rounded bg-surface-low p-4 w-full';card.innerHTML='<div class="text-xl"></div><div class="fixture-row"><span>Players <span class="count">'+count+'/4</span></span><span>Format Commander</span><button>Join</button></div>';card.querySelector('.text-xl').textContent=title;card.querySelector('button').onclick=()=>prejoin(title);native.append(card);}status.textContent='Demo lobby ready.';}
function prejoin(title){history.pushState({},'', '/game/demo-room');native.innerHTML='<section class="fixture-panel"><h2>Joining</h2><p id="room-name"></p><button id="join-now">Join Now</button></section>';document.querySelector('#room-name').textContent=title;document.querySelector('#join-now').onclick=game;status.textContent='Demo prejoin screen.';}
function game(){native.innerHTML='<section class="fixture-panel" id="player"><div><input aria-label="Life Total" type="number" value="40"></div><div id="player-trigger"><input aria-describedby="playerpopover" style="display:none"><button>Demo player — <span id="selected-commanders">No commander(s) set</span></button></div></section><section class="fixture-panel"><label>Demo chat <textarea placeholder="Type a message"></textarea></label><button id="send">Send</button><p id="sent"></p></section>';document.querySelector('#send').onclick=()=>{document.querySelector('#sent').textContent=document.querySelector('textarea').value;document.querySelector('textarea').value='';};document.querySelector('#player-trigger').onclick=popover;status.textContent='Joined the simulated room.';}
let commanders=[];
function popover(){const pop=document.querySelector('#popover-container');if(pop.children.length){pop.replaceChildren();return;}pop.innerHTML='<div class="fixture-panel"><div id="edit-link">Edit Decklist</div><p>Commander(s)</p><input placeholder="+ Add commander"><div id="search-results"></div></div>';document.querySelector('#edit-link').onclick=()=>{pop.replaceChildren();document.querySelector('#modal-container').innerHTML='<div class="fixture-panel"><input placeholder="https://www.moxfield.com/decks/wDHf-XLpKUi4ktsNtoye8g"><button id="submit-link">Submit</button></div>';document.querySelector('#submit-link').onclick=()=>{status.textContent='Native deck link saved in simulation.';document.querySelector('#modal-container').replaceChildren();};};pop.querySelector('input').oninput=e=>{const results=document.querySelector('#search-results');results.replaceChildren();const name=e.target.value;setTimeout(()=>{if(!results.isConnected)return;const option=document.createElement('div');option.role='button';option.textContent=name;option.onclick=()=>{commanders.push(name);document.querySelector('#selected-commanders').textContent=commanders.join(' + ');results.replaceChildren();pop.querySelector('input').value='';};results.append(option);},220);};}
document.querySelector('#reset').onclick=()=>{commanders=[];lobby();};document.querySelector('#full').onclick=()=>{const count=document.querySelector('.count');if(count)count.textContent='4/4';};
if(!localStorage.getItem('spelltable-plus:v1'))localStorage.setItem('spelltable-plus:v1',JSON.stringify({decks:[{id:'demo-krenko',name:'Krenko tokens',commanders:['Krenko, Mob Boss'],url:'https://www.moxfield.com/decks/demo',include:'BR4, BR3 no mox',exclude:'cedh, precon'}],selectedId:'demo-krenko',include:'BR4, BR3 no mox',exclude:'cedh, precon',autoCommander:true,finishJoin:true}));
lobby();
</script><script src="/dist/spelltable-plus.user.js"></script></body></html>
